name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # 生成代码必须与 api/openapi.yaml 保持同步：
      # 若有人改了文档却忘了 make generate，这里会失败并提示重新生成。
      - name: 校验生成代码是否最新
        run: |
          make generate
          if ! git diff --exit-code -- '*.gen.go'; then
            echo "::error::生成代码与 api/openapi.yaml 不一致，请本地执行 make generate 并提交"
            exit 1
          fi

      - name: 格式检查
        run: make fmt-check

      - name: 静态检查
        run: make vet

      - name: 测试（含数据竞争检测）
        run: make test-race

      - name: 构建
        run: make build
